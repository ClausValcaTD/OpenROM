# .github/workflows/build.yml
name: Build Cross-Platform Tools

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git cmake make g++ wget jq \
            liblz4-dev libuv1-dev libdeflate-dev
      
      - name: Download pre-built chdman
        run: |
          mkdir -p output/linux
          # Get latest MAME release
          TAG=$(curl -s https://api.github.com/repos/mamedev/mame/releases/latest | jq -r .tag_name)
          echo "Downloading chdman from $TAG"
          wget "https://github.com/mamedev/mame/releases/download/${TAG}/${TAG}_tools_linux.tar.gz"
          tar -xzf ${TAG}_tools_linux.tar.gz
          cp chdman output/linux/
          chmod +x output/linux/chdman
      
      - name: Build maxcso
        run: |
          git clone https://github.com/unknownbrackets/maxcso.git /tmp/maxcso
          cd /tmp/maxcso && make -j$(nproc)
          cp maxcso output/linux/
      
      - name: Build ecm
        run: |
          git clone https://github.com/alucryd/ecm-tools.git /tmp/ecm
          cd /tmp/ecm && meson setup build && meson compile -C build
          cp build/ecm build/unecm output/linux/
      
      - name: Build extract-xiso
        run: |
          git clone https://github.com/XboxDev/extract-xiso.git /tmp/xiso
          cd /tmp/xiso && mkdir build && cd build && cmake .. && make -j$(nproc)
          cp extract-xiso output/linux/
      
      - name: Upload Linux release
        uses: softprops/action-gh-release@v1
        with:
          files: output/linux/*
          tag_name: tools-linux-v${{ github.run_number }}
          name: "Linux Tools v${{ github.run_number }}"

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          brew install cmake make lz4 libuv libdeflate wget jq
      
      - name: Download pre-built chdman
        run: |
          mkdir -p output/macos-${{ matrix.arch }}
          TAG=$(curl -s https://api.github.com/repos/mamedev/mame/releases/latest | jq -r .tag_name)
          # macOS binaries from MAME
          wget "https://github.com/mamedev/mame/releases/download/${TAG}/${TAG}_tools_macOS.tar.gz" || \
          wget "https://github.com/mamedev/mame/releases/download/${TAG}/${TAG}_tools_macOS-arm64.tar.gz"
          tar -xzf *.tar.gz
          cp chdman output/macos-${{ matrix.arch }}/ || echo "chdman not found, will build"
      
      - name: Build remaining tools
        run: |
          # maxcso, ecm, extract-xiso (same as Linux)
          # ...
      
      - name: Upload macOS release
        uses: softprops/action-gh-release@v1
        with:
          files: output/macos-${{ matrix.arch }}/*
          tag_name: tools-macos-${{ matrix.arch }}-v${{ github.run_number }}
          name: "macOS ${{ matrix.arch }} Tools v${{ github.run_number }}"
