name: Build macOS Assets
on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install rom-tools ecm libuv lz4

      - name: Build maxcso from source
        run: |
          git clone --depth=1 https://github.com/unknownbrackets/maxcso /tmp/maxcso_src
          cd /tmp/maxcso_src && make -j$(sysctl -n hw.logicalcpu)

      - name: Download extract-xiso
        run: |
          curl -L https://github.com/XboxDev/extract-xiso/releases/latest/download/extract-xiso_macOS.zip -o xiso.zip
          unzip xiso.zip
          chmod +x extract-xiso

      - name: Copy binaries
        run: |
          mkdir -p assets/macos/${{ matrix.arch }}
          cp $(which chdman)                     assets/macos/${{ matrix.arch }}/chdman
          cp /tmp/maxcso_src/maxcso              assets/macos/${{ matrix.arch }}/maxcso
          cp $(which ecm-compress)               assets/macos/${{ matrix.arch }}/ecm
          cp $(which ecm-uncompress)             assets/macos/${{ matrix.arch }}/unecm
          cp extract-xiso                        assets/macos/${{ matrix.arch }}/extract-xiso
          chmod +x assets/macos/${{ matrix.arch }}/*

      - name: Verify binaries
        run: |
          echo "=== ${{ matrix.arch }} ==="
          for f in chdman maxcso ecm unecm extract-xiso; do
            path="assets/macos/${{ matrix.arch }}/$f"
            if [ -f "$path" ]; then
              echo "✅ $f — $(du -sh $path | cut -f1)"
            else
              echo "❌ $f MISSING"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: assets/macos/${{ matrix.arch }}/
