# .github/workflows/build.yml
name: Build Cross-Platform Tools

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ Fix for 403 error
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git cmake make g++ \
            liblz4-dev libuv1-dev libdeflate-dev
      
      - name: Build chdman
        run: |
          git clone --depth 1 https://github.com/mamedev/mame.git /tmp/mame
          cd /tmp/mame
          # ✅ Fix: Precompile first
          make -j$(nproc) SUBTARGET=tools TOOLS=1 PRECOMPILE=1 || true
          make -j$(nproc) SUBTARGET=tools TOOLS=1
          cp chdman $GITHUB_WORKSPACE/output/linux/
      
      - name: Build maxcso
        run: |
          git clone https://github.com/unknownbrackets/maxcso.git /tmp/maxcso
          cd /tmp/maxcso && make -j$(nproc)
          cp maxcso $GITHUB_WORKSPACE/output/linux/
      
      - name: Build ecm
        run: |
          git clone https://github.com/alucryd/ecm-tools.git /tmp/ecm
          cd /tmp/ecm && meson setup build && meson compile -C build
          cp build/ecm build/unecm $GITHUB_WORKSPACE/output/linux/
      
      - name: Build extract-xiso
        run: |
          git clone https://github.com/XboxDev/extract-xiso.git /tmp/xiso
          cd /tmp/xiso && mkdir build && cd build && cmake .. && make -j$(nproc)
          cp extract-xiso $GITHUB_WORKSPACE/output/linux/
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/linux/*
          tag_name: tools-linux-${{ github.run_number }}
          body: "Linux x86_64 tools build"

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write  # ✅ Fix for 403 error
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          brew install cmake make lz4 libuv libdeflate
      
      - name: Build all tools
        run: |
          mkdir -p output/macos-${{ matrix.arch }}
          # Build steps here...
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/macos-${{ matrix.arch }}/*
          tag_name: tools-macos-${{ matrix.arch }}-${{ github.run_number }}
          body: "macOS ${{ matrix.arch }} tools build"
