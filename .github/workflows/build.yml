# .github/workflows/build.yml
name: Build Cross-Platform Tools

on:
  workflow_dispatch:  # Manual trigger only
  schedule:
    - cron: '0 0 * * 0'  # Weekly auto-build

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git cmake make g++ \
            liblz4-dev libuv1-dev libdeflate-dev
      
      - name: Build all tools
        run: |
          mkdir -p output/linux
          # chdman
          git clone --depth 1 https://github.com/mamedev/mame.git /tmp/mame
          cd /tmp/mame && make -j$(nproc) SUBTARGET=tools TOOLS=1
          cp /tmp/mame/chdman $GITHUB_WORKSPACE/output/linux/
          # maxcso
          git clone https://github.com/unknownbrackets/maxcso.git /tmp/maxcso
          cd /tmp/maxcso && make -j$(nproc)
          cp /tmp/maxcso/maxcso $GITHUB_WORKSPACE/output/linux/
          # ecm
          git clone https://github.com/alucryd/ecm-tools.git /tmp/ecm
          cd /tmp/ecm && meson setup build && meson compile -C build
          cp /tmp/ecm/build/ecm /tmp/ecm/build/unecm $GITHUB_WORKSPACE/output/linux/
          # extract-xiso
          git clone https://github.com/XboxDev/extract-xiso.git /tmp/xiso
          cd /tmp/xiso && mkdir build && cd build && cmake .. && make -j$(nproc)
          cp /tmp/xiso/build/extract-xiso $GITHUB_WORKSPACE/output/linux/
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/linux/*
          tag_name: tools-linux-${{ github.run_number }}
          body: "Linux x86_64 tools build"

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: |
          brew install cmake make lz4 libuv libdeflate
      
      - name: Build all tools
        run: |
          mkdir -p output/macos-${{ matrix.arch }}
          # Same build steps as Linux
          # ... (chdman, maxcso, ecm, extract-xiso)
      
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: output/macos-${{ matrix.arch }}/*
          tag_name: tools-macos-${{ matrix.arch }}-${{ github.run_number }}
