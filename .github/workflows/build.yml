# .github/workflows/build.yml
name: Build Cross-Platform Tools

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - Check workspace
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la
      
      - name: Create output directory
        run: mkdir -p $GITHUB_WORKSPACE/output/linux
      
      - name: Verify directory exists
        run: |
          ls -la $GITHUB_WORKSPACE/output/
          ls -la $GITHUB_WORKSPACE/output/linux/
      
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git cmake make g++ ninja-build \
            liblz4-dev libuv1-dev libdeflate-dev
      
      - name: Build chdman standalone
        run: |
          git clone https://github.com/CharlesThobe/chdman.git /tmp/chdman
          cd /tmp/chdman
          cmake -B build -G Ninja
          cmake --build build
          
          # Debug
          echo "Build complete, checking output:"
          ls -la build/
          
          # Copy with absolute path
          cp build/chdman $GITHUB_WORKSPACE/output/linux/
          chmod +x $GITHUB_WORKSPACE/output/linux/chdman
          
          # Verify
          ls -la $GITHUB_WORKSPACE/output/linux/
      
      - name: Build maxcso
        run: |
          git clone https://github.com/unknownbrackets/maxcso.git /tmp/maxcso
          cd /tmp/maxcso && make -j$(nproc)
          cp maxcso $GITHUB_WORKSPACE/output/linux/
      
      - name: Build ecm
        run: |
          git clone https://github.com/alucryd/ecm-tools.git /tmp/ecm
          cd /tmp/ecm && meson setup build && meson compile -C build
          cp build/ecm build/unecm $GITHUB_WORKSPACE/output/linux/
      
      - name: Build extract-xiso
        run: |
          git clone https://github.com/XboxDev/extract-xiso.git /tmp/xiso
          cd /tmp/xiso && mkdir build && cd build && cmake .. && make -j$(nproc)
          cp extract-xiso $GITHUB_WORKSPACE/output/linux/
      
      - name: Final check
        run: |
          echo "Final output directory:"
          ls -la $GITHUB_WORKSPACE/output/linux/
      
      - name: Upload Linux release
        uses: softprops/action-gh-release@v1
        with:
          files: $GITHUB_WORKSPACE/output/linux/*
          tag_name: tools-linux-v${{ github.run_number }}
          name: "Linux Tools v${{ github.run_number }}"
