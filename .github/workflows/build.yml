# .github/workflows/build-macos.yml
name: Build macOS Assets
on: workflow_dispatch  # تشغيله يدوي لما تحتاجه

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install rom-tools maxcso ecm
      - name: Copy binaries
        run: |
          mkdir -p assets/macos
          cp $(which chdman) assets/macos/chdman
          cp $(which maxcso) assets/macos/maxcso
          cp $(which ecm-compress) assets/macos/ecm
          cp $(which ecm-uncompress) assets/macos/unecm
      - name: Download extract-xiso
        run: |
          curl -L https://github.com/XboxDev/extract-xiso/releases/latest/download/extract-xiso_macOS.zip -o xiso.zip
          unzip xiso.zip -d assets/macos/
          mv assets/macos/extract-xiso* assets/macos/extract-xiso
          chmod +x assets/macos/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: assets/macos/
