name: Build nodtool Binaries

on:
  workflow_dispatch:
    inputs:
      nod_ref:
        description: 'nod branch/tag/commit to build from'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Checkout nod
        uses: actions/checkout@v4
        with:
          repository: encounter/nod
          ref: ${{ github.event.inputs.nod_ref }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build nodtool
        run: cargo build --release -p nodtool --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodtool_windows
          path: target/x86_64-pc-windows-msvc/release/nodtool.exe

  # ── Linux x86_64 ───────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y -q musl-tools

      - name: Checkout nod
        uses: actions/checkout@v4
        with:
          repository: encounter/nod
          ref: ${{ github.event.inputs.nod_ref }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build nodtool (static musl)
        run: cargo build --release -p nodtool --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodtool_linux
          path: target/x86_64-unknown-linux-musl/release/nodtool

  # ── macOS arm64 ────────────────────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Checkout nod
        uses: actions/checkout@v4
        with:
          repository: encounter/nod
          ref: ${{ github.event.inputs.nod_ref }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build nodtool
        run: cargo build --release -p nodtool --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodtool_macos_arm64
          path: target/aarch64-apple-darwin/release/nodtool

  # ── macOS x86_64 ───────────────────────────────────────────────────────────
  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Checkout nod
        uses: actions/checkout@v4
        with:
          repository: encounter/nod
          ref: ${{ github.event.inputs.nod_ref }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build nodtool
        run: cargo build --release -p nodtool --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodtool_macos_x86_64
          path: target/x86_64-apple-darwin/release/nodtool

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename binaries
        run: |
          mkdir release
          cp artifacts/nodtool_windows/nodtool.exe     release/nodtool-windows-x86_64.exe
          cp artifacts/nodtool_linux/nodtool            release/nodtool-linux-x86_64
          cp artifacts/nodtool_macos_arm64/nodtool      release/nodtool-macos-arm64
          cp artifacts/nodtool_macos_x86_64/nodtool     release/nodtool-macos-x86_64
          chmod +x release/nodtool-linux-x86_64
          chmod +x release/nodtool-macos-arm64
          chmod +x release/nodtool-macos-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nodtool-${{ github.event.inputs.nod_ref }}
          name: nodtool (${{ github.event.inputs.nod_ref }})
          body: |
            Pre-built `nodtool` binaries from [encounter/nod](https://github.com/encounter/nod) @ `${{ github.event.inputs.nod_ref }}`.

            Built for use with [OpenROM](https://github.com/M5Devs/OpenROM).

            | Platform | File |
            |----------|------|
            | Windows x86_64 | `nodtool-windows-x86_64.exe` |
            | Linux x86_64 (static) | `nodtool-linux-x86_64` |
            | macOS Apple Silicon | `nodtool-macos-arm64` |
            | macOS Intel | `nodtool-macos-x86_64` |

            License: MIT / Apache-2.0 — see [encounter/nod](https://github.com/encounter/nod/blob/main/LICENSE-MIT)
          files: |
            release/nodtool-windows-x86_64.exe
            release/nodtool-linux-x86_64
            release/nodtool-macos-arm64
            release/nodtool-macos-x86_64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
